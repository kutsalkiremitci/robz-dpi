# Robz DPI'ın Linux'taki motoru ve yönetici yardımcısı: arayüzü olmayan küçük bir program (robzdpi-engine).
#
# Kaynak kodu uygulamayla ortaktır (../src/engine, plan.rs …); burada yalnız giriş noktası vardır. Ayrı bir paket
# olmasının nedeni bağımlılıklarıdır: arayüz kitaplıklarına (GTK, WebKit) bağlanmaz. Böylece
#   * motor, root yetkisiyle çalışan servis olarak yalnız gereksindiği kodu yükler,
#   * AppImage içinden de kurulabilir (AppImage'ın kendi kitaplıkları sistemde bulunmayabilir).
# Windows'ta kullanılmaz: orada motor uygulamanın kendi exe'sidir.
[package]
name = "robzdpi-engine"
version = "0.6.0"
description = "Robz DPI motoru (Linux)"
license = "MIT"
repository = "https://github.com/kutsalkiremitci/robz-dpi"
edition = "2021"
rust-version = "1.85"
publish = false

[[bin]]
name = "robzdpi-engine"
path = "src/main.rs"
test = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
idna = "1"
nfq = "0.2"
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
